<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a3d2c" />
  <meta name="description" content="오승열의 대입뉴스 — 입시 이슈 브리핑 대시보드" />
  <title>오승열의 대입뉴스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div id="boot" class="boot" role="status" aria-live="polite" aria-busy="true">
    <div class="boot__panel">
      <div class="boot__brand">
        <span class="boot__mark" aria-hidden="true"></span>
        <span class="boot__name">오승열의 대입뉴스</span>
      </div>
      <p class="boot__msg" id="bootMsg">대시보드를 준비하는 중…</p>
      <div class="boot__spinner" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="boot__progress"><div class="boot__bar" id="bootBar"></div></div>
      <p class="boot__pct" id="bootPct">0%</p>
    </div>
  </div>

  <header class="top" id="topBar" hidden>
    <div class="top__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <div class="brand__text">
          <strong>오승열의 대입뉴스</strong>
          <em>ADMISSIONS BRIEF</em>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="보기">
        <button type="button" class="tabs__btn is-on" role="tab" aria-selected="true" data-view="latest">최신</button>
        <button type="button" class="tabs__btn" role="tab" aria-selected="false" data-view="popular">인기</button>
        <button type="button" class="tabs__btn" role="tab" aria-selected="false" data-view="report">보고서</button>
      </nav>

      <form class="search" id="searchForm" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <label class="sr-only" for="q">검색</label>
        <input id="q" name="q" type="search" placeholder="이슈 · 대학 · 태그" autocomplete="off" enterkeyhint="search" />
        <button type="button" class="search__clear" id="searchClear" hidden aria-label="검색 지우기">×</button>
      </form>

      <div class="top__end">
        <div class="top__meta">
          <span class="period" id="periodLabel">전체 기간</span>
          <span class="sync-status" id="syncStatus" data-mode="idle"></span>
        </div>
        <div class="top__actions">
          <button type="button" class="icon" id="dateBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="dateSheet" title="기간">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="icon" id="syncBtn" title="동기화">
            <span class="sync-spin" aria-hidden="true"></span>
            <svg class="sync-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.2-5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M20 4v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="app" id="app" hidden>
    <div class="layout">
      <aside class="rail rail--left" id="railLeft" aria-label="요약">
        <section class="glass">
          <h2 class="glass__title">브리핑 요약</h2>
          <div class="stat-grid" id="statGrid"></div>
        </section>
        <section class="glass">
          <h2 class="glass__title">월별 밀도</h2>
          <div class="pulse" id="monthPulse"></div>
        </section>
      </aside>

      <div class="center">
        <section class="hero-band" id="heroBand"></section>
        <p class="hint" id="viewHint">날짜순 최신 이슈</p>
        <div class="preview-dock" id="previewDock" hidden></div>
        <div class="mobile-rails" id="mobileRails" aria-label="빠른 보기"></div>
        <main class="main" id="main" aria-live="polite"></main>
      </div>

      <aside class="rail rail--right" id="railRight" aria-label="트렌드">
        <section class="glass glass--accent">
          <h2 class="glass__title">핫 키워드</h2>
          <div class="kw" id="hotKeywords"></div>
        </section>
        <section class="glass">
          <h2 class="glass__title">관심 이슈 Top</h2>
          <div class="mini-rank" id="miniRank"></div>
        </section>
        <section class="glass">
          <h2 class="glass__title">원본</h2>
          <a class="doc-link" id="sourceLink" href="#" target="_blank" rel="noopener">Google Doc 열기 →</a>
        </section>
      </aside>
    </div>

    <footer class="foot">
      <p>오승열의 대입뉴스 · 입시 이슈 브리핑</p>
    </footer>
  </div>

  <div class="sheet" id="dateSheet" hidden>
    <button type="button" class="sheet__dim" id="dateDim" aria-label="닫기"></button>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="dateTitle">
      <div class="sheet__grab" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 id="dateTitle">기간 선택</h2>
        <button type="button" class="sheet__close" id="dateClose">닫기</button>
      </div>
      <div class="sheet__body" id="dateList"></div>
    </div>
  </div>

  <div class="sheet sheet--reader" id="detailSheet" hidden>
    <button type="button" class="sheet__dim" id="detailDim" aria-label="닫기"></button>
    <div class="reader" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <header class="reader__bar">
        <button type="button" class="reader__nav" id="readerBack" hidden aria-label="이전 이슈">←</button>
        <h2 id="detailTitle">미리보기</h2>
        <button type="button" class="sheet__close" id="detailClose">닫기</button>
      </header>
      <div class="reader__scroll" id="detailBody"></div>
    </div>
  </div>

  <button type="button" class="fab" id="toTop" aria-label="맨 위로" hidden>↑</button>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/js/parse-doc.js" defer></script>
  <script src="assets/js/dashboard.js" defer></script>
</body>
</html>
